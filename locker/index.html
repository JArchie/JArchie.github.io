<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>外卖柜取餐</title>
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, "HarmonyOS Sans SC", "PingFang SC", sans-serif;
      background: #f5f6f8;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #e8f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    .locker {
      display: none;
      font-size: 15px;
      color: #0a59f7;
      font-weight: 500;
      margin: 0 0 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.7;
      color: #8a8a8f;
      margin: 0;
    }
    .tip {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f2f4f7;
      font-size: 13px;
      line-height: 1.6;
      color: #6b6b70;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h1>请安装「配送工作台」后使用扫码取餐</h1>
    <p class="locker" id="locker"></p>
    <p>安装完成后重新扫描外卖柜上的二维码，即可直接打开开柜页面。</p>
    <div class="tip">当前为网页兜底页面：应用已安装时，扫码会直接唤起应用，不会显示本页。</div>
  </div>
  <script>
    var no = new URLSearchParams(location.search).get('lockerNo');
    if (no) {
      var el = document.getElementById('locker');
      el.textContent = no + '号柜 · 待开启';
      el.style.display = 'block';
    }
  </script>
</body>
</html>
